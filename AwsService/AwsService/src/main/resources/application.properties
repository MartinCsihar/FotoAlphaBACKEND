spring.application.name=aws-service
server.port=8083
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

aws.bucket.name=${AWS_BCKT_NAME}
aws.region=${AWS_REGION}
aws.credentials.secret-key=${AWS_SECRET_ACCESS_KEY}
aws.credentials.access-key=${AWS_ACCESS_KEY_ID}
jwt.secret-key=${JWT_SECRET_KEY_GEN}

spring.kafka.producer.properties.spring.json.add.type.headers=true
spring.kafka.producer.properties.spring.json.type.mapping=savePhotos:com.fotoalpha.awsservice.Events.SavePhotosEvent,saveProfPic:com.fotoalpha.awsservice.Events.SaveProfilePictureEvent
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.bootstrap-servers=localhost:9094

spring.servlet.multipart.max-file-size=53687091200
spring.servlet.multipart.max-request-size=53687091200
logging.level.org.springframework.web.multipart=DEBUG
logging.level.org.apache.tomcat.util.http.fileupload=DEBUG
server.tomcat.max-swallow-size=-1
server.tomcat.max-part-count=-1
